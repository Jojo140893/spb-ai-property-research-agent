<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SPB — Live Builder Stock</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#14181f; --muted:#5d6673; --line:#e3e7ec;
    --accent:#1d6feb; --ok:#0f8a4f; --warn:#b4690e; --stop:#b42318; --chip:#eef2f7;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1117; --panel:#161b23; --ink:#e6e9ef; --muted:#98a2b3; --line:#252c38;
           --accent:#4d9bff; --ok:#3fbd7d; --warn:#e0a340; --stop:#f2685c; --chip:#1e2530; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1500px;margin:0 auto;padding:22px 16px 60px}
  header h1{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
  header p{margin:0;color:var(--muted);font-size:13px}
  .cards{display:grid;gap:10px;margin:18px 0;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card .n{font-size:24px;font-weight:650;letter-spacing:-.02em}
  .card .k{color:var(--muted);font-size:12px;margin-top:2px}
  .panels{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .panel h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .bar{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:13px}
  .bar span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  input[type=search],select{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
  input[type=search]{flex:1 1 240px}
  .count{color:var(--muted);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none;
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);z-index:1}
  th:hover{color:var(--ink)}
  th[data-dir]:after{content:" ↑";color:var(--accent)}
  th[data-dir="desc"]:after{content:" ↓"}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.addr{white-space:normal;min-width:210px;max-width:340px}
  tbody tr:hover{background:var(--chip)}
  .pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
    background:var(--chip);color:var(--muted)}
  .pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.stop{color:var(--stop)}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .more{display:block;width:100%;margin-top:12px;padding:10px;background:var(--panel);
    color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit;cursor:pointer}
  .more:hover{border-color:var(--accent)}
  footer{margin-top:26px;color:var(--muted);font-size:12px}
  .note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
    border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:var(--muted)}
  @media (max-width:640px){ td.addr{max-width:180px} .wrap{padding:14px 10px 50px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Smart Property Buying — live builder stock</h1>
    <p id="sub">loading…</p>
  </header>

  <div class="note">
    Contains commercial stock data. This URL is public by default — add a password under
    <strong>Vercel → Project → Settings → Deployment Protection</strong> before sharing widely.
    Search engines are asked not to index it, which is a request, not a guarantee.
  </div>

  <div class="cards" id="cards"></div>
  <div class="panels" id="panels"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="Search builder, address, suburb, estate, design…">
    <select id="f-b"><option value="">All builders</option></select>
    <select id="f-st"><option value="">All states</option></select>
    <select id="f-av"><option value="">Any availability</option></select>
    <select id="f-pt"><option value="">All products</option></select>
    <span class="count" id="count"></span>
  </div>

  <div class="scroll">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <button class="more" id="more" hidden></button>

  <footer id="foot"></footer>
</div>

<script>
const PAGE = 200;
const MONEY = new Set(['p','lp','bp','in']);
const NUM   = new Set(['bd','ba','c','ls','hs']);
const LINKS = ['u1','u2','u3'];
let D = null, view = [], shown = 0, sortKey = null, sortDir = 1;

const fmtMoney = v => (v === null || v === '' || v === undefined || +v === 0)
  ? '' : '$' + Math.round(+v).toLocaleString();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function availClass(v){
  const s = String(v || '').toLowerCase();
  if (s.includes('avail') && !s.includes('not') && !s.includes('un')) return 'ok';
  if (s.includes('hold') || s.includes('offer')) return 'warn';
  if (s.includes('sold') || s.includes('not') || s.includes('un')) return 'stop';
  return '';
}

fetch('stock.json').then(r => r.json()).then(d => { D = d; init(); })
  .catch(e => document.getElementById('sub').textContent = 'could not load stock.json: ' + e);

function init(){
  const m = D.meta, I = k => D.keys.indexOf(k);
  document.getElementById('sub').textContent =
    `${m.total.toLocaleString()} listings from ${m.builders} builders and developments · harvested ${m.generated}`;

  document.getElementById('cards').innerHTML = [
    [m.total.toLocaleString(), 'listings'],
    [m.builders, 'builders / developments'],
    [m.with_availability.toLocaleString(), 'with availability'],
    [m.with_links.toLocaleString(), 'with a PDF or floorplan link'],
    [(m.total - m.blank_builder).toLocaleString(), 'with a named builder'],
  ].map(([n,k]) => `<div class="card"><div class="n">${n}</div><div class="k">${k}</div></div>`).join('');

  const panel = (title, pairs) => `<div class="panel"><h3>${title}</h3>` +
    pairs.map(([v,n]) => `<div class="bar"><span>${esc(v)}</span><span>${n.toLocaleString()}</span></div>`).join('') +
    `</div>`;
  document.getElementById('panels').innerHTML =
    panel('By state', m.by_state) + panel('By availability', m.by_availability) +
    panel('By product', m.by_product) + panel('By source', m.by_channel) +
    panel('Attribution', m.by_scope);

  const fill = (id, pairs) => {
    const el = document.getElementById(id);
    pairs.filter(([v]) => v && v !== '—').forEach(([v,n]) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = `${v} (${n})`; el.appendChild(o);
    });
  };
  fill('f-b', m.top_builders); fill('f-st', m.by_state);
  fill('f-av', m.by_availability); fill('f-pt', m.by_product);

  document.getElementById('head').innerHTML = D.labels
    .map((l,i) => `<th data-i="${i}">${esc(l)}</th>`).join('');
  document.querySelectorAll('#head th').forEach(th => th.onclick = () => {
    const i = +th.dataset.i;
    if (sortKey === i) sortDir = -sortDir; else { sortKey = i; sortDir = 1; }
    document.querySelectorAll('#head th').forEach(x => x.removeAttribute('data-dir'));
    th.dataset.dir = sortDir === 1 ? 'asc' : 'desc';
    render();
  });

  ['q','f-b','f-st','f-av','f-pt'].forEach(id => {
    const el = document.getElementById(id);
    el.oninput = el.onchange = render;
  });
  document.getElementById('more').onclick = () => { shown += PAGE; paint(); };

  document.getElementById('foot').innerHTML =
    `Builder taken from E-Agent's own per-builder section heading, or from the stocklist ` +
    `file name for developments E-Agent lists without one. Blank means neither was ` +
    `available — never a guess. Credentials, saved sessions and passwords are excluded ` +
    `from this export by an explicit column allow-list.`;
  render();
}

function render(){
  const I = k => D.keys.indexOf(k);
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fb = document.getElementById('f-b').value;
  const fst = document.getElementById('f-st').value;
  const fav = document.getElementById('f-av').value;
  const fpt = document.getElementById('f-pt').value;
  const searchable = ['b','a','su','es','st','av'].map(I);

  view = D.rows.filter(r => {
    if (fb && r[I('b')] !== fb) return false;
    if (fst && r[I('st')] !== fst) return false;
    if (fav && r[I('av')] !== fav) return false;
    if (fpt && r[I('pt')] !== fpt) return false;
    if (!q) return true;
    return searchable.some(i => String(r[i] ?? '').toLowerCase().includes(q));
  });

  if (sortKey !== null){
    const k = D.keys[sortKey], numeric = MONEY.has(k) || NUM.has(k);
    view.sort((x,y) => {
      let a = x[sortKey], b = y[sortKey];
      if (numeric){ a = +a || 0; b = +b || 0; return (a-b) * sortDir; }
      return String(a ?? '').localeCompare(String(b ?? '')) * sortDir;
    });
  }
  shown = PAGE;
  paint();
}

function paint(){
  const body = document.getElementById('body');
  const rows = view.slice(0, shown);
  body.innerHTML = rows.map(r => '<tr>' + r.map((v,i) => {
    const k = D.keys[i];
    if (LINKS.includes(k))
      return v ? `<td><a href="${esc(v)}" target="_blank" rel="noopener noreferrer">open</a></td>` : '<td></td>';
    if (MONEY.has(k)) return `<td class="num">${fmtMoney(v)}</td>`;
    if (NUM.has(k))   return `<td class="num">${v ?? ''}</td>`;
    if (k === 'av')   return `<td><span class="pill ${availClass(v)}">${esc(v || '—')}</span></td>`;
    if (k === 'a')    return `<td class="addr">${esc(v)}</td>`;
    if (k === 'b')    return `<td>${esc(v) || '<span class="pill">not named</span>'}</td>`;
    return `<td>${esc(v)}</td>`;
  }).join('') + '</tr>').join('');

  document.getElementById('count').textContent =
    `${view.length.toLocaleString()} of ${D.meta.total.toLocaleString()} shown` +
    (view.length > shown ? ` · first ${shown.toLocaleString()}` : '');
  const more = document.getElementById('more');
  more.hidden = view.length <= shown;
  more.textContent = `Show ${Math.min(PAGE, view.length - shown).toLocaleString()} more`;
}
</script>
</body>
</html>
