<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1020" role="img"
     aria-label="Smart Property Buying">
  <title>Smart Property Buying</title>
  <!--
    A REPRODUCTION of the Smart Property Buying mark, drawn to match the artwork Ahsan
    supplied on 5 Aug 2026, for use until the official file is dropped in beside it.

    client_report.LOGO_CANDIDATES looks for spb-logo.png / spb-logo.svg FIRST and only
    falls back to this, so adding the real artwork supersedes this file automatically
    with no code change. Vector rather than a traced bitmap so it stays sharp in a
    printed report at any size.
  -->
  <rect width="1020" height="1020" rx="96" fill="#1450C8"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="38"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- House: left wall up to the apex, down the right slope, and along the base.
         Drawn as one open path so the roof line stays continuous. -->
    <path d="M 336 527 V 306 L 510 172 L 684 306 V 527 H 336 Z"/>
    <!-- Chimney on the right slope -->
    <path d="M 622 236 V 168 H 660 V 266"/>
  </g>

  <!-- Four-pane window -->
  <g fill="#FFFFFF">
    <rect x="466" y="318" width="40" height="40" rx="5"/>
    <rect x="518" y="318" width="40" height="40" rx="5"/>
    <rect x="466" y="370" width="40" height="40" rx="5"/>
    <rect x="518" y="370" width="40" height="40" rx="5"/>
  </g>

  <!-- The digital "dissolve" squares off the right edge of the roof -->
  <g fill="#FFFFFF">
    <rect x="672" y="330" width="26" height="26" rx="4"/>
    <rect x="710" y="356" width="20" height="20" rx="3"/>
    <rect x="672" y="386" width="20" height="20" rx="3"/>
    <rect x="712" y="404" width="14" height="14" rx="3"/>
  </g>

  <!-- Tick, overlapping the lower left of the house -->
  <path d="M 396 436 L 492 520 L 652 342" fill="none" stroke="#FFFFFF"
        stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark. system-ui keeps it crisp without embedding a font, which would make
       this file an order of magnitude larger inside every emailed report. -->
  <g fill="#FFFFFF" text-anchor="middle"
     font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
     font-weight="700">
    <text x="510" y="648" font-size="112" letter-spacing="4">SMART</text>
    <text x="510" y="762" font-size="112" letter-spacing="2">PROPERTY</text>
    <text x="510" y="858" font-size="82" letter-spacing="14">BUYING</text>
  </g>
</svg>
