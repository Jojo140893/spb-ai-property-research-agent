# The nightly harvest, on GitHub's machines instead of Ahsan's laptop.
#
# WHY THIS EXISTS. The Windows Task Scheduler job fired on time 3 days in 5 and ran ~6
# hours late twice, because the laptop is off overnight. Coleen's dashboard was only ever
# as fresh as the last time that machine happened to be awake.
#
# WHAT MADE IT POSSIBLE. Two things that were believed impossible and were measured
# instead, on 12 Aug 2026:
#   * Proxima's session is PORTABLE — replayed in a fresh browser context with no profile
#     it reached the full portal, 40 projects, no 2FA. The device-trust cookie runs to
#     28 Jan 2027. PROJECT_PLAN.md's "can never run unattended" was wrong about the reason.
#   * The database can leave the laptop. state_sync.py keeps spb_research_audit.db in a
#     private Supabase bucket with a lock, so a runner pulls it, harvests, and pushes back.
#
# SESSIONS ARE NOT SECRETS HERE. They travel in the bucket beside the database, because
# they expire — Proxima's died twice in nine days — and putting them in repo settings would
# mean a human editing GitHub every few days. The laptop refreshes them with
# portal_login.py / export_proxima_session.py and this run picks them up on its pull.

name: Daily harvest

on:
  schedule:
    # 23:00 UTC = 09:00 Melbourne (AEST, UTC+10). Colin asked for 9am after a 5:28am
    # listing was missed; anything earlier risks the same gap. GitHub's scheduler is
    # best-effort and can lag under load, which is still far better than "whenever the
    # laptop next boots".
    - cron: "0 23 * * *"
  workflow_dispatch:        # so a failed night can be re-run by hand without waiting

concurrency:
  # The bucket lock already stops two runs corrupting the database — this stops the second
  # run even starting, so it fails fast rather than sitting on a refused pull.
  group: spb-daily-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    # A full run is ~30 minutes; three times that is a hang, not a slow day.
    timeout-minutes: 90

    env:
      # THE RUNNER IS UTC, AND EVERY DATE THIS HARVEST WRITES IS A LOCAL ONE.
      #
      # date_checked is datetime.now().strftime("%d/%m/%Y") in eight places, and the cron
      # is 23:00 UTC precisely so it lands at 09:00 Melbourne. On a UTC runner that stamps
      # YESTERDAY: the 17 Aug 23:21 run — 09:21 on the 18th in Melbourne — wrote
      # "17/08/2026" on every row, and the Settings tab correctly reported every source as
      # "1 day ago" on a morning they had all just delivered. That is a false alarm on the
      # one page whose job is to say when a source went quiet, and it fired every day.
      #
      # It also straddled midnight UTC (23:21 -> 00:03), so a single harvest stamped rows
      # with two different dates, which the staleness flag and deploy.ps1's staleness
      # guard both measure against.
      #
      # Melbourne is the business's clock — Colin reads these dates, not the runner — so
      # the runner keeps it. 09:21 AEST is nowhere near a date boundary either.
      TZ: Australia/Melbourne
      # Portal credentials. secrets_store resolves portal+field to an env name
      # (portal_bathla + password -> PORTAL_BATHLA_PASSWORD) and falls back to env when no
      # OS vault exists, which is exactly the case on a Linux runner.
      E_AGENT_USERNAME: ${{ secrets.E_AGENT_USERNAME }}
      E_AGENT_PASSWORD: ${{ secrets.E_AGENT_PASSWORD }}
      PORTAL_BATHLA_USERNAME: ${{ secrets.PORTAL_BATHLA_USERNAME }}
      PORTAL_BATHLA_PASSWORD: ${{ secrets.PORTAL_BATHLA_PASSWORD }}
      PORTAL_HERMITAGE_HOMES_USERNAME: ${{ secrets.PORTAL_HERMITAGE_HOMES_USERNAME }}
      PORTAL_HERMITAGE_HOMES_PASSWORD: ${{ secrets.PORTAL_HERMITAGE_HOMES_PASSWORD }}
      PORTAL_PARAMOUNT_LIVING_USERNAME: ${{ secrets.PORTAL_PARAMOUNT_LIVING_USERNAME }}
      PORTAL_PARAMOUNT_LIVING_PASSWORD: ${{ secrets.PORTAL_PARAMOUNT_LIVING_PASSWORD }}
      PORTAL_PROXIMA_USERNAME: ${{ secrets.PORTAL_PROXIMA_USERNAME }}
      PORTAL_PROXIMA_PASSWORD: ${{ secrets.PORTAL_PROXIMA_PASSWORD }}

      # digital@ inbox. NOTE: this was failing IMAP auth on 12 Aug against
      # imap.hostinger.com, mid Outlook->Gmail migration. Fix the mailbox before trusting
      # this channel here.
      # EMAIL_INBOX_*, not IMAP_USERNAME/IMAP_PASSWORD. secrets_store maps
      # get_credentials("email_inbox") to EMAIL_INBOX_USERNAME / EMAIL_INBOX_PASSWORD;
      # the IMAP_* names I first wrote here would have been read by nothing at all and
      # the channel would have failed on the runner exactly as it does locally, for a
      # different reason, with the same message.
      IMAP_HOST: imap.gmail.com
      IMAP_PORT: "993"
      EMAIL_INBOX_USERNAME: ${{ secrets.EMAIL_INBOX_USERNAME }}
      EMAIL_INBOX_PASSWORD: ${{ secrets.EMAIL_INBOX_PASSWORD }}

      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SPB_STATE_SYNC: "1"

      # PINNED, and this is load-bearing. browser_user_agent() derives the UA from the
      # installed Chromium, so a Linux runner would present "X11; Linux x86_64" where
      # Proxima granted device trust to "Windows NT 10.0". Whether it binds trust to the UA
      # is not established; a re-challenge costs a human with Colin's inbox, so this takes
      # the cheap side of that bet.
      SPB_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36"

    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the secrets are not set
        # Without this the run gets 25 minutes in and reports a harvest failure, which
        # reads as "the portals broke" rather than "nobody added the credentials".
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN E_AGENT_USERNAME E_AGENT_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Required secrets are not set:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Required secrets present."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Chromium
        # --with-deps pulls the system libraries headless Chromium needs on ubuntu-latest;
        # without it Playwright launches and dies on a missing .so with a stack trace that
        # says nothing about the real cause.
        #
        # BOUNDED, BECAUSE IT HUNG TWICE IN ONE DAY. --with-deps shells out to apt-get,
        # which waits forever on a dpkg lock or a prompt. On 19 Aug two runs froze here
        # — 32227500945 and 32233167273 — each burning the full 90-minute job timeout and
        # publishing nothing, while the step's own healthy time is 33 to 36 seconds.
        #
        # So: a hard 5-minute cap on the apt path, then a retry WITHOUT it. The
        # browser-only install touches no apt at all, and the ubuntu-latest image already
        # carries most of what Chromium needs — a run that gets that far is far better
        # than one that sits for an hour and a half. If the browser itself is then
        # unusable, the Harvest step fails loudly in seconds rather than silently.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -uo pipefail
          if timeout 300 python -m playwright install --with-deps chromium; then
            echo "chromium + system deps installed"
          else
            echo "::warning::playwright install --with-deps did not finish in 5 minutes           (apt is the usual cause) — retrying the browser only, without apt."
            timeout 300 python -m playwright install chromium
          fi

      - name: Install the Supabase CLI
        # NOT supabase/setup-cli@v1. The first run died on it in 63 seconds with a bare
        # "##[error]fetch failed" — the action resolves `version: latest` by calling the
        # GitHub releases API, and that call failed. A nightly job that cannot start
        # because a version lookup was rate-limited is a nightly job that fails on
        # someone else's schedule, and the error says nothing about why.
        #
        # The release tarball is a fixed URL, so there is no lookup to fail. Pinned
        # deliberately: an unattended run should not pick up a new CLI overnight, given
        # this integration already depends on four undocumented CLI behaviours
        # (--experimental, --yes, no-overwrite, relative paths only).
        run: |
          set -euo pipefail
          VER=2.113.0
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://github.com/supabase/cli/releases/download/v${VER}/supabase_linux_amd64.tar.gz" \
            -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Link the Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Harvest
        # --no-deploy: publishing is its own step below, so a data failure can never push a
        # partial snapshot over a good one. That rule predates this workflow and is kept.
        #
        # tee _daily.log: THE ALERT BELOW READS THAT FILE AND NOTHING EVER WROTE IT.
        # Two steps grep _daily.log — the one that names the dead channel and the one that
        # tails the log on failure — and in CI the harvest only ever wrote to stdout. So
        # the 20 Aug failure reported "A channel returned nothing tonight: see the harvest
        # summary below", and the summary below it was empty, while the line naming the
        # channel ("- Proxima: read 0 tonight, 3922 listing(s) already stored") sat in the
        # step log where no alert could reach it. The channel-naming comment below has
        # been describing behaviour that never ran on a runner.
        #
        # pipefail keeps the harvest's own exit code across the pipe; -u keeps the output
        # ordered rather than arriving in 8 KB blocks after the fact.
        run: |
          set -o pipefail
          python -u run_daily.py --state-sync --no-deploy --email-days 7 2>&1 | tee _daily.log

      - name: Publish to Vercel
        # Only when the harvest succeeded — same guarantee run_daily.cmd gives on Windows.
        if: success()
        run: |
          npm i -g vercel@latest
          # SAY WHAT THE TOKEN CAN SEE BEFORE TRYING TO DEPLOY WITH IT.
          #
          # "Error: Project not found ({VERCEL_PROJECT_ID, VERCEL_ORG_ID})" has two very
          # different causes and reads identically for both: wrong IDs, or a token that
          # cannot see the team those IDs belong to. Guessing between them costs a
          # 21-minute harvest per attempt, because this step only runs after the harvest
          # succeeds. These two commands separate them in seconds:
          #   whoami fails      -> the token is invalid or expired
          #   whoami works but
          #   project ls fails  -> the token is PERSONAL-scope and cannot see the team;
          #                        reissue it at vercel.com/account/tokens with the scope
          #                        set to digitalx-solutions-projects
          echo "--- who does this token belong to? ---"
          vercel whoami --token "$VERCEL_TOKEN" || echo "whoami FAILED — token invalid or expired"
          echo "--- can it see the team's projects? ---"
          vercel project ls --scope digitalx-solutions-projects --token "$VERCEL_TOKEN" 2>&1 | head -15 \
            || echo "project ls FAILED — the token cannot see team digitalx-solutions-projects"
          cd vercel_site
          # --scope, because the project lives under the TEAM
          # digitalx-solutions-projects and vercel_site/ is gitignored — so the runner
          # has no .vercel/project.json and nothing tells the CLI which account to look
          # in. The 12 Aug run supplied both IDs and still got
          # "Error: Project not found ({VERCEL_PROJECT_ID, VERCEL_ORG_ID})", which is
          # what that failure looks like: the token authenticated fine, it just could
          # not see a team project.
          #
          # If this still fails with the same message, the TOKEN is personal-scope. A
          # team-scoped one has to be created at
          # vercel.com/account/tokens with the scope set to digitalx-solutions-projects.
          vercel deploy --prod --yes \
            --scope digitalx-solutions-projects \
            --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Check the login gate is still up
        # THE FAILURE THIS CATCHES IS SILENT. middleware.js is written by build_web.py into
        # a gitignored folder; a refactor that stops writing it produces a completely
        # healthy-looking green run that publishes the entire catalogue to the open web,
        # and nothing anywhere would say so. 401 is the PASS here.
        if: success()
        run: |
          set -uo pipefail
          URL=https://app.smartpropertybuying.com.au
          code=$(curl -s -o /tmp/body -w "%{http_code}" "$URL/stock.json")
          echo "GET /stock.json -> $code"
          if [ "$code" = "200" ]; then
            echo "::error::stock.json is being served to anyone — the login gate is NOT running."
            exit 1
          fi
          if [ "$code" = "503" ] && grep -q "SITE_PASSWORD is not set" /tmp/body; then
            echo "::error::SITE_PASSWORD is not set on the Vercel project; the dashboard is refusing to serve."
            exit 1
          fi
          if [ "$code" != "401" ]; then
            echo "::error::stock.json answered $code, expected 401."
            exit 1
          fi
          login=$(curl -s -o /tmp/login -w "%{http_code}" "$URL/login")
          if [ "$login" != "200" ] || ! grep -q 'name="password"' /tmp/login; then
            echo "::error::/login answered $login without a sign-in form — the dashboard is unreachable."
            exit 1
          fi
          echo "Gate is up: stock.json 401, login page served."

      - name: Fail the run if a channel died
        # DELIBERATELY THE LAST STEP, after the publish above. A dead channel must not
        # withhold the channels that DID read — their rows are fresh and stale rows are
        # already live from last night, so refusing to publish helps nobody. But the run
        # has to go RED, because printing it did not work: E-Agent's sign-in broke on
        # 13 Aug and the next three nightly runs logged
        #   [FAILED] a channel that has stock returned nothing this run
        #     - E-Agent: read 0 tonight, 8773 listing(s) already stored
        # and reported SUCCESS to GitHub. Three green ticks over ~4,500 stale listings,
        # found only when a consultant could not find stock he was looking at directly
        # in E-Agent.
        if: always()
        run: |
          if [ -f _harvest_partial ]; then
            # NAME THE CHANNEL, not the step. The marker carries run_daily's STEP labels
            # ("1/7  Harvest stock (E-Agent + portals + digital email)"), because that is
            # all run_daily sees — harvest_buildings knows which channel died but only
            # signals it through an exit code. The first run of this alert therefore said
            # a channel called "1/7 Harvest stock..." had died, which names every channel
            # and so names none. harvest_buildings prints the real thing to the log:
            #     - Direct Builder Portal (live): read 0 tonight, 388 listing(s) already stored
            DEAD=$(grep -oE "^ +- [^:]+: read 0 tonight" _daily.log 2>/dev/null \
                   | sed -E 's/^ +- //; s/: read 0 tonight//' | sort -u | paste -sd', ' -)
            echo "::error::A channel returned nothing tonight: ${DEAD:-see the harvest summary below}"
            echo "Its stored rows are going stale while the dashboard serves them as current."
            echo ""
            # SHOW THE ACTUAL ERROR BEFORE PRESCRIBING A CURE FOR A DIFFERENT ONE.
            # On 20 Aug this alert said the usual cause is an expired sign-in. It was not:
            # the auth check had passed at 09:26 and the log said "Page.goto: Timeout
            # 30000ms exceeded". Re-authenticating a working session fixes nothing, and
            # the one line that would have said so was already in the log.
            echo "--- what the harvest actually reported ---"
            grep -E "ERROR|crashed|Timeout|sign-in expired|auth check failed" _daily.log               | tail -8 || echo "(no error line found)"
            echo ""
            echo "If that says the sign-in expired, refresh it on the laptop:"
            echo "    python portal_login.py e_agent"
            echo "    python portal_login.py portal_proxima --profile"
            echo "then push the refreshed session:  python state_sync.py push"
            echo ""
            echo "--- harvest summary ---"
            grep -E "^\[FAILED\]|read 0 tonight|read .* this run" _daily.log | head -20 || true
            exit 1
          fi
          echo "Every channel that holds stock read something tonight."

      - name: Log tail on failure
        if: failure()
        run: tail -120 _daily.log || echo "no _daily.log written"
