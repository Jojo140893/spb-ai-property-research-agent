# Put a new dashboard password live: store it in Vercel, redeploy, wait until it signs people in.
#
# WHY THIS EXISTS (23 Oct 2026). Colin wants to change the dashboard password himself (people have
# left his team). The reset page (api/reset_password.py) checks the emailed code, turns the new
# password into a signed, encrypted record, and starts THIS workflow with it. The record has to become
# an env var on the Vercel project because the team is on Vercel Hobby: keeping it in Vercel Blob would
# have meant a Blob read on every sign-in check, which runs the shared 10,000-a-month quota out and then
# locks Blob (and sign-in with it) for 30 days. An env var is read from memory. It only changes with a
# redeploy, which is what the steps below do. Design: api/_spb_auth.py; runbook:
# docs/password-reset-runbook.md.
#
# WHERE THE TOKENS LIVE. The dashboard's function holds only GITHUB_DISPATCH_TOKEN (already there for the
# Refresh button): it can start workflows and do nothing on Vercel. The token that writes the env var and
# redeploys is the VERCEL_TOKEN secret below, the one the nightly already uses (team-scoped to
# digitalx-solutions-projects); it never enters the dashboard's runtime.
#
# NOT FOR HAND USE, AND NEVER "RE-RUN". The record's mac needs SPB_AUTH_SECRET, which only the Vercel
# project holds, so the first step asks the live site (POST /api/reset_check) whether the dashboard
# signed this record, and stops unless it answers 204. Review, 25 Oct 2026: before that check, anyone
# who could start this workflow (GITHUB_DISPATCH_TOKEN, which every function on the project can read, or
# write access to this repo) could hand it a record of the right shape; it was stored and redeployed,
# and since the middleware checks the mac before anything else, sign-in answered 503 for everyone until
# the owner deleted SPB_PW_RECORD by hand. The same step refuses a record more than 30 minutes old or
# not newer than the live one (the same number counts as not newer: second review, 25 Oct 2026), so
# re-running an old run (or pasting a record from an old log) cannot put an older password back: start a
# new reset instead.
#
# ONLY ON MAIN, AND VERCEL_TOKEN ONLY WHERE IT IS USED (second review, 25 Oct 2026). workflow_dispatch
# takes any ref and runs that ref's code, so the job runs only for main (the dashboard always dispatches
# main), and only the three steps that call Vercel get the token. This guard is in this file, so it holds
# for every branch cut from main from now on. A branch carrying an OLDER copy of this file has no guard:
# keep pre-review commits off GitHub, or put VERCEL_TOKEN in an Environment limited to main (runbook,
# section 7).
#
# EVERY STEP RUNS ONLY IF THE ONES BEFORE IT PASSED: no step here has an `if:` or continue-on-error (the
# job's main-only `if:` decides whether anything runs at all), and tests/test_forgot_password.py keeps it
# that way. A refused check stops the job before anything is written.
#
# What a failure means: the old password still works and nothing changed, EXCEPT after the "Store it in
# Vercel" step, when the record is saved and the next deploy (the nightly) puts it live anyway, signing
# everyone out at that moment. GitHub emails the failure to whoever owns GITHUB_DISPATCH_TOKEN.

name: Apply dashboard password

on:
  workflow_dispatch:
    inputs:
      record:
        description: "Written by the dashboard's reset page. Not for hand use (see the top of this file)."
        required: true
        type: string

permissions:
  contents: read
  actions: read                # to count this workflow's recent runs (the daily cap below)

concurrency:
  # One change at a time, in the order they were asked for; the last one wins. Never cancelled
  # half-way, so a record is never stored without the redeploy that follows it.
  group: dashboard-password
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SCOPE: digitalx-solutions-projects
      SITE: https://app.smartpropertybuying.com.au
      MAX_PER_DAY: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Refuse an old, malformed or one-too-many record
        id: check
        # The record reaches a script ONLY through RECORD, set on the two steps that need it. Writing the
        # input expression straight into a run block would let a crafted value run shell commands here.
        env:
          RECORD: ${{ inputs.record }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Shape and age (made in the last 30 minutes), by the same parser that made it.
          out=$(python3 api/_spb_auth.py check-record)
          read -r epoch id <<< "$out"
          # Signed by the dashboard: only the live site holds SPB_AUTH_SECRET, so it checks the mac (and,
          # under the mac, the fingerprint, the age and the epoch again). Anything but 204, including no
          # answer at all, stops here. The record goes on stdin, never on a command line.
          check="$RUNNER_TEMP/reset-check.json"
          status=$(python3 -c 'import json, os, sys; sys.stdout.write(json.dumps({"record": os.environ["RECORD"]}))' \
                   | curl -s -o "$check" -w '%{http_code}' --max-time 30 -X POST \
                          -H 'Content-Type: application/json' --data-binary @- "$SITE/api/reset_check") \
            || status="no answer"
          if [ "$status" != "204" ]; then
            why=$(python3 -c 'import json, re, sys; w = str(json.load(sys.stdin).get("error", "")); print(w if re.fullmatch(r"[a-z_]{1,40}", w) else "")' 2>/dev/null < "$check" || true)
            echo "::error::$SITE did not confirm that the dashboard signed this record (HTTP $status${why:+, $why}). Nothing was changed."
            exit 1
          fi
          # Newer than the password that is live now. The same number is not newer: two resets made at the
          # same moment share one, and once either is live the other must not replace it.
          live=$(curl -s -o /dev/null -D - "$SITE/login" | tr -d '\r' \
                 | awk 'tolower($1) == "x-spb-auth-epoch:" { print $2 }')
          if ! [[ "$live" =~ ^[0-9]+$ ]]; then
            echo "::error::$SITE/login did not report which password is live. Nothing was changed."
            exit 1
          fi
          if [ "$epoch" -le "$live" ]; then
            echo "::error::This is password number $epoch but number $live is already live. Refusing to replace it with one that is not newer."
            exit 1
          fi
          # Vercel Hobby allows 100 deployments a day, and every password change is one. Running out would
          # stop the nightly publishing, so at most MAX_PER_DAY changes in any 24 hours, counted from
          # GitHub's own record of this workflow's runs. Only runs that got as far as storing a password
          # count: one GitHub refused (billing) or that this step refused (a forged record) changed
          # nothing, and counting those let a forger, or a day of billing failures, use up the day's
          # changes (second review, 25 Oct 2026). If GitHub does not say, nothing is changed.
          if ! recent=$(python3 api/_spb_auth.py count-applied); then
            echo "::error::Could not count this workflow's recent password changes. Nothing was changed."
            exit 1
          fi
          if ! [[ "$recent" =~ ^[0-9]+$ ]]; then
            echo "::error::The count of recent password changes was not a number. Nothing was changed."
            exit 1
          fi
          if [ "$recent" -ge "$MAX_PER_DAY" ]; then
            echo "::error::$recent password changes in the last 24 hours (limit $MAX_PER_DAY). Refusing, so the day's Vercel deployments are not used up."
            exit 1
          fi
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Record $id is password number $epoch (live: $live); $recent other changes in 24 hours."

      - name: Install the Vercel CLI
        run: npm i -g vercel@65.2.0 >/dev/null 2>&1

      - name: Wait for any production deploy in progress
        # Hobby builds one deployment at a time, in order. If the nightly (or the Refresh button) is
        # mid-publish, a redeploy started now would finish AFTER it and put the older build (yesterday's
        # stock) back live, and a nightly build created before the env change would lack the password.
        # Waiting until nothing is building closes both: whatever is created after this point sees the
        # new env var, and our redeploy starts from the newest build.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          for i in $(seq 1 40); do
            busy=$(vercel list vercel_site --environment production --status BUILDING,QUEUED,INITIALIZING \
                     --json --scope "$SCOPE" --token "$VERCEL_TOKEN" 2>/dev/null \
                   | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["deployments"]))' || echo "?")
            if [ "$busy" = "0" ]; then echo "No production deploy in progress."; exit 0; fi
            echo "Production deploys in progress: $busy. Waiting."
            sleep 15
          done
          echo "::error::A production deploy was still in progress after 10 minutes. Nothing was changed."
          exit 1

      - name: Store it in Vercel
        # --sensitive: nobody can read the value back out of the Vercel dashboard. --force: it replaces
        # the previous record. From stdin, so the value never appears in a command line.
        env:
          RECORD: ${{ inputs.record }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$RECORD" | vercel env add SPB_PW_RECORD --environment production \
            --force --sensitive --yes --scope "$SCOPE" --token "$VERCEL_TOKEN"
          echo "SPB_PW_RECORD stored for Production."

      - name: Redeploy production so it takes effect
        # A redeploy rebuilds the deployment that is live now with today's env vars, so it changes nothing
        # but the password. Production domains follow it automatically.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          live=$(vercel inspect "${SITE#https://}" --scope "$SCOPE" --token "$VERCEL_TOKEN" 2>&1 \
                 | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | head -1 || true)
          if [ -z "$live" ]; then
            echo "::error::Could not find the live deployment behind $SITE. The record IS stored: the next nightly deploy puts it live."
            exit 1
          fi
          echo "Redeploying $live"
          vercel redeploy "$live" --scope "$SCOPE" --token "$VERCEL_TOKEN"

      - name: Wait until the new password signs people in
        # /login reports the live record (middleware.js, withEpoch). The reset page watches the same
        # headers to tell Coleen when to sign in. Then two probes of the live gate: stock.json must still
        # need a login, and a wrong password must get 401, which proves the stored password can actually
        # be checked on Vercel's runtime (a 500 or 503 there would mean nobody can sign in).
        env:
          EPOCH: ${{ steps.check.outputs.epoch }}
          ID: ${{ steps.check.outputs.id }}
        run: |
          set -uo pipefail
          for i in $(seq 1 40); do
            headers=$(curl -s -o /dev/null -D - "$SITE/login" | tr -d '\r')
            seen=$(awk 'tolower($1) == "x-spb-auth-epoch:" { print $2 }' <<< "$headers")
            seen_id=$(awk 'tolower($1) == "x-spb-auth-id:" { print $2 }' <<< "$headers")
            if [ "$seen_id" = "$ID" ]; then
              code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/stock.json")
              if [ "$code" != "401" ]; then
                echo "::error::The new password is live but stock.json answered $code, expected 401."
                exit 1
              fi
              probe=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                      --data "email=probe%40example.invalid&password=not-the-password" "$SITE/login")
              if [ "$probe" != "401" ]; then
                echo "::error::A wrong password got $probe, not 401: the stored password cannot be checked. Runbook section 5."
                exit 1
              fi
              echo "Password number $EPOCH ($ID) is live; stock.json 401; a wrong password 401."
              exit 0
            fi
            if [[ "$seen" =~ ^[0-9]+$ ]] && [ "$seen" -gt "$EPOCH" ]; then
              echo "A newer password (number $seen) went live after this one. Nothing more to do."
              exit 0
            fi
            sleep 15
          done
          echo "::error::After 10 minutes /login reports password ${seen:-none} (${seen_id:-none}), not $EPOCH ($ID)."
          echo "If it reports 0, SITE_PASSWORD changed after the code was sent and the record is ignored:"
          echo "ask for a new code. If /login answers 503, SPB_PW_RECORD or SPB_AUTH_SECRET is wrong:"
          echo "docs/password-reset-runbook.md, section 5."
          exit 1
