# Ask the hook to scan Kommo "Incoming leads" for WhatsApp leads the bot has qualified.
#
# WHAT IT IS FOR. A WhatsApp lead answers 8 questions to a Kommo bot, in a fixed order, with
# the customer's own reply latency between them: measured on 23 Sep, the gaps ran from
# 2m 38s to 12h 47m. Nothing tells us when the last answer lands. So the hook's scan endpoint
# reads the column, finds the leads that have a Prefered State (the minimum Agent 2 needs)
# and writes them to the same store the Clare's Leads tab reads. Polling is the only
# mechanism available: Kommo's bot does not call us.
#
# WHY IT LIVES HERE AND NOT ON VERCEL. The hook is a Vercel project and its plan is not
# established. Vercel's Hobby plan allows ONE cron per DAY, which for a 12-hour reply gap is
# the same as not running. GitHub Actions has no such limit, and the nightly harvest already
# runs from here, so this is a schedule the team already watches.
#
# THE 15 MINUTES COME FROM A RELAY, NOT FROM THE SCHEDULE (29 Oct 2026). GitHub's scheduler
# is best-effort: over 26-29 Oct it started this "*/15" cron 11 times in three days instead
# of about 288, so a WhatsApp lead could wait hours. Now each run starts the next one itself
# (the last step below, `gh workflow run`; GITHUB_TOKEN may start workflow_dispatch runs).
# The new run's job waits in the `scan-timer` environment, whose 14-minute wait timer is a
# repo setting: free on a public repo and no runner is held while it waits. So a scan lands
# about every 15 minutes: 14 waiting, about one scanning and queueing the next.
#   - The cron stays as the RESTARTER, and it is a slow one: over 26-29 Oct it fired 2 to 7
#     hours apart. If a link fails to queue the next one (a GitHub outage that outlasts the
#     retries), GitHub does no scans until a cron firing lands. Keep a scheduler outside
#     GitHub calling the same endpoint as well (the laptop task today); doubled scans are
#     harmless.
#   - The concurrency group below keeps it to ONE relay. A group holds one running and one
#     pending run, and a newer pending run cancels the older one. So a cron run that lands
#     while the relay is going either is cancelled or takes the relay over; it never starts
#     a second one. Cancelled runs in the list are this, not a fault.
#   - To STOP the relay but keep the cron: set the repo variable SPB_SCAN_RELAY to "off".
#     To stop all of it: `gh workflow disable whatsapp-scan.yml`.
#   - Cancelling a run by hand also ends the relay, since its last step does not run on
#     cancel. Start it again with Run workflow.
#   - A by-hand Run workflow also waits the 14 minutes. While the relay is going it usually
#     cancels, or is cancelled by, the relay's pending run. That is fine: there is still one
#     scan every 15 minutes. For a scan this minute, POST the hook directly.
#   - The relay always continues on the default branch. A run on any other branch (a test)
#     queues the next one only while its test_hops input is above 0, counting down, so a
#     test relay ends by itself.
# A doubled or skipped scan is harmless: the scan skips a lead whose record already exists
# and whose fieldsFingerprint still matches.
#
# THE LOG IS PUBLIC, SO IT CARRIES COUNTS ONLY. This repository is public, and so is every
# run's log, 96 a day. The scan's answer lists leads, each with the lead id and Agent 2's
# note, so the step prints only the counts. The error lines are cut before their bracketed
# detail. The per-lead detail stays in the hook's store and in Kommo.
#
# THE SCAN IS READ-ONLY AGAINST KOMMO. It never PATCHes a lead, because a PATCH on a card in
# Incoming leads EJECTS IT FROM THE COLUMN (see WORKLOG.md §5). This workflow can therefore
# be re-run by hand as often as anyone likes without touching the CRM.
#
# NO SECRET VALUE IS IN THIS FILE. The key comes from repo secrets; GitHub masks a registered
# secret wherever it appears in a log line, including inside a response body.

name: WhatsApp lead scan

on:
  schedule:
    # The relay's restarter (see above). It runs every 15 minutes, UTC, when GitHub honours it. The
    # minutes are off the hour because GitHub drops the most runs on the hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:        # the relay's own trigger, and a by-hand start
    inputs:
      test_hops:
        description: "Branch tests only: how many more runs the relay may queue (ignored on the default branch)"
        required: false
        default: "0"

concurrency:
  # TWO SCANS MUST NEVER OVERLAP. A run that takes longer than 15 minutes (a slow Kommo, a
  # cold Vercel function, a retry) would otherwise be joined by the next one, and both would
  # read the same column and race to write the same record. cancel-in-progress is false: the
  # scan already running has done the expensive part, so the newcomer waits its turn rather
  # than killing a read that is nearly finished.
  group: spb-whatsapp-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    # A scheduled workflow keeps firing in a fork that never wanted it; this pins it to the
    # one repository whose secrets can actually answer.
    if: github.repository == 'Jojo140893/spb-ai-property-research-agent'
    runs-on: ubuntu-latest
    # The relay's pause: the job waits here on the environment's 14-minute wait timer
    # before a runner is assigned. Waiting is not billed and holds no runner.
    environment: scan-timer
    # The job's budget is the scan's 10 minutes (a step limit below) plus room for the relay
    # step's retries. A job timeout counts as a cancel, which would skip the relay step, so
    # the scan has its own, smaller limit: a scan that times out fails, and the relay goes on.
    # The environment wait comes before the job starts, so it does not count.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write        # to queue the next run of this workflow (the relay)

    env:
      HOOK_SECRET: ${{ secrets.HOOK_SECRET }}
      # Overridable without editing this file, because the hook's deployment URL is the
      # hook team's to change. Repo variables (not secrets) -- neither is sensitive.
      HOOK_BASE: ${{ vars.SPB_HOOK_BASE || 'https://vapi-kommo-hook.vercel.app' }}
      SCAN_PATH: ${{ vars.SPB_WHATSAPP_SCAN_PATH || '/api/whatsapp-scan' }}

    steps:
      - name: Fail loudly if the hook secret is not set
        # WITHOUT THIS THE RUN STILL "WORKS". curl would post ?key= with nothing after it,
        # the hook would answer 401 'bad key', and the failure below would read as a wrong
        # secret rather than a missing one -- sending whoever reads it to rotate a key that
        # was never there. 96 runs a day would say it, all of them wrong.
        run: |
          set -uo pipefail
          if [ -z "${HOOK_SECRET:-}" ]; then
            echo "::error::HOOK_SECRET is not set, so no WhatsApp lead can be scanned."
            echo "Add it under Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Name: HOOK_SECRET. Value: the same string the vapi-kommo-hook Vercel project"
            echo "holds in its own HOOK_SECRET environment variable (kept locally in"
            echo "make-tools/hook_secret.txt -- do not paste it into a log, an issue or this file)."
            exit 1
          fi
          echo "HOOK_SECRET is present."

      - name: Scan Kommo Incoming leads
        # The scan's own limit (curl's worst case is about 8.5 minutes). A step that times out
        # fails, and the relay step still runs; a job timeout would cancel it.
        timeout-minutes: 10
        # The key travels in the QUERY STRING because that is how the hook authenticates
        # every one of its endpoints (api/webhook.js: req.query.key !== env.HOOK_SECRET).
        # It is built into a shell variable rather than written into the curl line so it is
        # never echoed; the runner is ephemeral and single-tenant, and daily-harvest.yml
        # already passes its Vercel token the same way.
        #
        # --retry covers a cold Vercel function and a dropped connection, so a blip does not
        # paint the repo red 96 times a day. Everything past that is reported, because a scan
        # that quietly stops is a WhatsApp lead nobody rings -- and there is no other signal
        # that it stopped.
        run: |
          set -uo pipefail
          url="${HOOK_BASE}${SCAN_PATH}?key=${HOOK_SECRET}"
          code=$(curl -sS -X POST \
                   -H 'Content-Type: application/json' \
                   --data '{"source":"github-actions"}' \
                   --max-time 120 --retry 3 --retry-delay 10 --retry-connrefused \
                   -o /tmp/scan.json -w '%{http_code}' \
                   "$url") || code="000"
          echo "POST ${HOOK_BASE}${SCAN_PATH} -> ${code}"
          # COUNTS, NEVER THE LEADS (the log is public). A number or true/false prints as
          # itself, a list as its length, anything else as "-"; status only when it is a
          # short plain word.
          echo "--- what the scan answered (counts only) ---"
          jq -r '
            def n(k): .[k] as $v
              | if ($v | type) == "number" or ($v | type) == "boolean" then ($v | tostring)
                elif ($v | type) == "array" then ($v | length | tostring)
                else "-" end;
            "status=" + ((.status // "-") | tostring
                          | if test("^[A-Za-z0-9_ -]{1,40}$") then . else "?" end)
            + " scanned=" + n("scanned") + " truncated=" + n("truncated")
            + " whatsapp=" + n("whatsapp") + " ready=" + n("ready")
            + " researched=" + n("researched") + " stored=" + n("stored")
            + " leads=" + n("leads") + " errors=" + n("errors")
          ' /tmp/scan.json 2>/dev/null || echo "(no JSON body)"
          case "$code" in
            2??)
              # A 200 IS NOT A SUCCESS ON ITS OWN. The scan answers 200 with a populated
              # "errors" array whenever per-lead work failed -- a contact it could not read,
              # a Blob write that failed, Agent 2 answering 401 -- because one bad lead must
              # not stop the other nineteen. Reading only the status turned a steady per-lead
              # failure into 96 green runs a day, with nothing anywhere saying a lead was
              # dropped. jq is on every GitHub-hosted runner.
              # Green needs the scan's real answer: an object with status "success" and an
              # errors list. An empty, null or {} body (a proxy page, say) is not a scan.
              nerr=$(jq -er 'if type == "object" and .status == "success" and (.errors | type) == "array"
                             then (.errors | length) else error("not a scan answer") end' \
                       /tmp/scan.json 2>/dev/null) || nerr="unreadable"
              case "$nerr" in ''|*[!0-9]*) nerr="unreadable" ;; esac
              if [ "$nerr" = "unreadable" ]; then
                echo "::error::The scan answered ${code} but its body is not the JSON it should be."
                exit 1
              fi
              if [ "$nerr" -gt 0 ]; then
                echo "::error::The scan ran but ${nerr} lead(s) failed. First errors:"
                # Cut at the first " (": the bracketed part is the underlying error text,
                # which is not ours to vouch for in a public log. What is left is the lead id
                # and what failed.
                jq -r '.errors[:5][] | tostring | gsub("[\r\n]+"; " ") | sub(" \\(.*"; "") | .[0:200]' \
                  /tmp/scan.json 2>/dev/null | sed 's/^/  /' || true
                exit 1
              fi
              echo "Scan completed with no per-lead errors."
              ;;
            000)
              echo "::error::Could not reach ${HOOK_BASE} at all (DNS, TLS or timeout), even after retries."
              exit 1
              ;;
            401)
              echo "::error::The hook refused the key (401). The HOOK_SECRET in this repo and the"
              echo "HOOK_SECRET on the vapi-kommo-hook Vercel project are not the same string."
              exit 1
              ;;
            404)
              echo "::error::No scan endpoint at ${SCAN_PATH} (404). Either the hook has not deployed it"
              echo "yet, or it lives at another path -- set the repo variable SPB_WHATSAPP_SCAN_PATH"
              echo "(Settings -> Secrets and variables -> Actions -> Variables) to the real one."
              exit 1
              ;;
            405)
              echo "::error::The scan endpoint answered 405: it does not accept POST at ${SCAN_PATH}."
              exit 1
              ;;
            500)
              echo "::error::The scan endpoint answered 500. Its own environment is probably incomplete"
              echo "(HOOK_SECRET, KOMMO_DOMAIN or KOMMO_TOKEN missing on the hook project)."
              exit 1
              ;;
            *)
              echo "::error::The scan endpoint answered ${code}."
              exit 1
              ;;
          esac

      - name: Queue the next scan (the relay)
        # It runs when the scan FAILED too: a failed scan is reported above and the relay goes
        # on, so a hook outage costs red runs, never a stopped scan. It skips only on cancel
        # (cancelling a run by hand ends the relay) and when the repo variable SPB_SCAN_RELAY
        # is "off".
        #
        # On the default branch it always queues the next run. On any other branch it queues
        # one only while test_hops is above 0, passing test_hops - 1, so a test relay stops
        # by itself and never outlives its branch's file.
        #
        # Both GitHub calls retry with backoff (about 5 minutes in all), because one failed
        # call ends the relay and the cron that restarts it fires hours apart.
        #
        # NO WAIT, NO RELAY. If the scan-timer environment is missing or loses its wait timer,
        # GitHub runs this job at once, and an unguarded relay would scan back to back:
        # hundreds of hook calls an hour, against Vercel's CPU limit and Kommo's API. So the
        # step measures how long ago this run was created. The wait timer alone makes that
        # 14 minutes or more; under 10 means there was no wait, and the relay stops.
        if: ${{ !cancelled() && vars.SPB_SCAN_RELAY != 'off' }}
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TEST_HOPS: ${{ inputs.test_hops || '0' }}
        run: |
          set -uo pipefail
          extra=()
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            case "$TEST_HOPS" in ''|*[!0-9]*) TEST_HOPS=0 ;; esac
            if [ "$TEST_HOPS" -le 0 ]; then
              echo "Branch ${GITHUB_REF_NAME} is not ${DEFAULT_BRANCH} and test_hops is 0: the test relay ends here."
              exit 0
            fi
            extra=(-f "test_hops=$((TEST_HOPS - 1))")
          fi
          created=""
          for t in 1 2 3 4 5; do
            created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at) && [ -n "$created" ] && break
            created=""; sleep $((t * 10))
          done
          if [ -z "$created" ]; then
            echo "::error::Could not read when this run was created, so the relay has stopped (it fails closed)."
            echo "Start it again with Run workflow; otherwise only a cron firing restarts it, hours apart."
            exit 1
          fi
          waited=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          if [ "$waited" -lt 600 ]; then
            echo "::error::This run started ${waited}s after it was created, so the scan-timer wait did not happen."
            echo "The relay has stopped rather than scan back to back. Check Settings -> Environments ->"
            echo "scan-timer -> Wait timer (14 minutes). The cron still scans when GitHub fires it."
            exit 1
          fi
          for try in 1 2 3 4 5; do
            if gh workflow run whatsapp-scan.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" "${extra[@]}"; then
              echo "Next scan queued on ${GITHUB_REF_NAME} ${extra[*]}; it waits in scan-timer, then scans."
              exit 0
            fi
            sleep $((try * 20))
          done
          echo "::error::Could not queue the next scan, so the relay has stopped."
          echo "Start it again with Run workflow; otherwise only a cron firing restarts it, hours apart."
          exit 1
